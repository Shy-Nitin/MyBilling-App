# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = backend/migrations

# template used to generate migration file names; The default value is --epoch-
file_template = %%(rev)s_%%(slug)s

# timezone to use when rendering the date within the migration file
# render_as_batch = True

# sqlalchemy.url is dynamically loaded from backend.app.core.config.settings.DATABASE_URL in env.py
sqlalchemy.url = sqlite:///./mybilling.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
